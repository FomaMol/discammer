services:
  web:
    ports: !override
      - "127.0.0.1:8000:8000"
    # A7 (non-root container): the app process runs as the unprivileged `app`
    # user (uid 10001). docker-entrypoint.sh self-heals /app/data ownership at
    # startup (runs as root, chowns the bind-mounted data dir, then drops via
    # gosu), so NO host-side `chown` of /opt/discammer/data is required.
