services:
  web:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      # Make uvicorn actually TRUST nginx's X-Forwarded-Proto.
      #
      # uvicorn ships proxy-header support on by default but only honours the
      # headers when the peer is in `forwarded_allow_ips`, which defaults to
      # "127.0.0.1". The line above publishes the app loopback-only ON THE HOST,
      # but the container's peer is the Docker bridge gateway (172.x.x.1) — so
      # the default never matched, uvicorn discarded X-Forwarded-Proto, and
      # every request looked like plain http to Starlette. The visible symptom
      # was `https://discammer.com/en/course/` answering 307 with
      # `Location: http://discammer.com/en/course`: redirect_slashes builds its
      # absolute Location from the ASGI scope scheme, and (unlike canonical /
      # sitemap / feed URLs, which seo.py patches via SITE_ORIGIN) nothing
      # corrected it. With no HSTS on the zone, browsers really did dial :80.
      #
      # It must be the bridge RANGE, never `*`. The wildcard looks equivalent
      # here — the container is loopback-published, so only nginx can reach it —
      # but it changes how uvicorn reads X-Forwarded-For, not just the scheme.
      # With `trusted_hosts="*"`, `_TrustedHosts.always_trust` is set and
      # `get_trusted_client_host()` returns `x_forwarded_for_hosts[0]`: the
      # LEFTMOST entry. nginx uses `$proxy_add_x_forwarded_for`, which APPENDS
      # the peer to whatever the caller sent, so the leftmost entry is
      # attacker-supplied. Anyone on the internet could send
      # `X-Forwarded-For: 127.0.0.1`, land in `scope["client"]` as 127.0.0.1,
      # and walk straight through `_is_local_request` — the only thing guarding
      # /api/metrics when METRICS_TOKEN is unset (backend/main.py:837-856).
      #
      # With a concrete CIDR, `always_trust` is False and the same function
      # walks the chain in REVERSE, returning the first hop NOT in the trusted
      # set — i.e. the address nginx appended, which a public client cannot
      # forge. X-Forwarded-Proto is still honoured because the peer really is
      # the bridge gateway. 172.16.0.0/12 covers Docker's whole default address
      # pool (172.17-172.31); uvicorn parses it via ipaddress.ip_network.
      #
      # Do NOT copy this into the base compose file, whose `8000:8000` binds
      # every interface. Per-IP rate limiting is unaffected either way —
      # `_client_ip` (backend/main.py) reads X-Real-IP / X-Forwarded-For itself
      # rather than relying on request.client.
      - FORWARDED_ALLOW_IPS=172.16.0.0/12
    # restart: unless-stopped (set in the base file) auto-recovers the realistic
    # failures: a crash or an OOM-kill exits the container (code 137) and Docker
    # brings it back. (An autoheal-style sidecar that restarts an *unhealthy but
    # alive* container was evaluated and dropped: it requires a host-root Docker
    # socket mount, and under host saturation — the exact flap we are fixing — it
    # can turn a slow reseed boot into a restart loop. The async app does not
    # block its event loop, so a wedged-but-alive worker is unlikely.)
    # === Non-root container (A1) — NO owner action required ===
    # The container runs as the non-root app user (uid:gid 10001, the image
    # default) and writes the SQLite DB to the bind-mounted /opt/discammer/data
    # volume. The root entrypoint (scripts/docker-entrypoint.sh) self-heals
    # ownership: on every start it `chown -R 10001:10001 /app/data` then drops
    # to that uid via gosu, so the seed can always open discammer.db.
    #
    # There is NO manual `chown` step on the prod host — the entrypoint handles
    # it idempotently, even on a fresh root-owned ./data. deploy.sh exports
    # APP_UID/APP_GID=10001 as build args; prod uses the defaults, so the owner
    # sets nothing. If the seed ever fails, /api/health returns 503 and
    # deploy.sh's probe rolls back to :prev — a loud, safe failure.
