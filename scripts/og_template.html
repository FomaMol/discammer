<!DOCTYPE html>
<!--
  DiScammer per-content Open Graph card — 1200×630.

  This file is a TEMPLATE, not a finished card. scripts/og_generate.py reads it,
  substitutes the __UPPERCASE__ placeholders below for a given post/guide, writes
  the result to a temp file, and screenshots it at exactly 1200×630.

  Brand chrome is lifted from backend/static/images/og/discammer-og.svg
  (cyberpunk briefing-room): canvas #151314, soft red #f29587 wordmark in JetBrains
  Mono, a 40px hairline grid, corner HUD brackets, amber/green/red semantic
  accents. The title uses Geist (same family base.html loads).

  Placeholders the generator fills (all are HTML-escaped by the script):
    __KIND_LABEL__   e.g. INTERVIEW / NEWSLETTER / ARTICLE / SCAM GUIDE
    __KIND_COLOR__   hex accent for the badge (brand/success/warning/danger)
    __TITLE__        localized content title
    __META_LINE__    bottom-left terminal line (kind/locale specific)
    __THREAT_BLOCK__ guides only: a 5-slat risk meter; '' for posts
-->
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<style>
__FONT_CSS__
  /* The generator embeds checked-in Latin/Cyrillic fonts above. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background-color: #151314;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ede5e3;
    /* 40px hairline grid — matches the hero chrome / discammer-og.svg pattern. */
    background-image:
      linear-gradient(to right, rgba(111, 92, 96, 0.30) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(111, 92, 96, 0.30) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Subtle brand vignette behind the content for depth (mirrors the SVG glow). */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(45% 45% at 30% 42%, rgba(242, 149, 135, 0.08), transparent 70%);
    pointer-events: none;
  }

  /* Hairline border frame, 40px inset. */
  .frame {
    position: absolute;
    inset: 32px;
    border: 1px solid #544447;
    pointer-events: none;
  }

  /* Analyst HUD corner brackets. */
  .bracket {
    position: absolute;
    width: 26px;
    height: 26px;
    border-color: #c17f77;
    opacity: 0.75;
  }
  .bracket.tl { top: 32px; left: 32px; border-top: 2px solid; border-left: 2px solid; }
  .bracket.tr { top: 32px; right: 32px; border-top: 2px solid; border-right: 2px solid; }
  .bracket.bl { bottom: 32px; left: 32px; border-bottom: 2px solid; border-left: 2px solid; }
  .bracket.br { bottom: 32px; right: 32px; border-bottom: 2px solid; border-right: 2px solid; }

  .stage {
    position: absolute;
    inset: 0;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── Top row: wordmark (logomark + DISCAMMER) + monitoring marker ── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  /* Strike-through D logomark, scaled to 44px. Geometry from the 24-unit grid. */
  .logomark { display: block; }
  .wordmark {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -1px;
    color: #f29587;
  }
  .monitoring {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3.2px;
    color: #7ce896;
  }
  .monitoring .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #7ce896;
  }

  /* ── Middle: kind badge + title ── */
  .middle {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    padding: 28px 0;
    min-height: 0;
  }
  .badge {
    align-self: flex-start;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 3px;
    /* --kind is set inline by the generator. */
    color: var(--kind);
    border: 1px solid var(--kind);
    background: color-mix(in srgb, var(--kind) 10%, transparent);
    margin-bottom: 28px;
  }
  .title {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    /* Title size is tuned by the generator (--title-size) so long Cyrillic
       strings, which run ~10-15% wider, don't overflow the card. */
    font-size: var(--title-size, 68px);
    line-height: 1.12;
    letter-spacing: -1.5px;
    color: #faf1ee;
    overflow-wrap: anywhere;
    flex-shrink: 0;
    max-width: 1000px;
  }

  /* ── Threat meter (guides only) ── */
  .threat {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    margin-top: 32px;
  }
  .threat-label {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #b6a29d;
    padding-bottom: 2px;
  }
  .slats { display: flex; gap: 7px; }
  .slat {
    width: 40px;
    height: 22px;
  }
  .slat.off { border: 1px solid #6f5c60; }

  /* ── Bottom: terminal meta line + domain ── */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: #b6a29d;
  }
  .bottom .domain { color: #b6a29d; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <span class="bracket tl"></span>
  <span class="bracket tr"></span>
  <span class="bracket bl"></span>
  <span class="bracket br"></span>

  <div class="stage">
    <div class="top">
      <div class="brand">
        <svg class="logomark" width="44" height="44" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#f29587" fill-rule="evenodd"
            d="M4 3 H16 a5 5 0 0 1 5 5 V16 a5 5 0 0 1 -5 5 H4 Z
               M8 7 H15 a1.5 1.5 0 0 1 1.5 1.5 V15.5 a1.5 1.5 0 0 1 -1.5 1.5 H8 Z"/>
          <rect x="2" y="10.75" width="21" height="2.5" fill="#f4b965"/>
        </svg>
        <span class="wordmark">DISCAMMER</span>
      </div>
      <div class="monitoring">
        <span class="dot"></span>
        <span>__EDUCATION_LABEL__</span>
      </div>
    </div>

    <div class="middle">
      <span class="badge" style="--kind: __KIND_COLOR__;">__KIND_LABEL__</span>
      <h1 class="title" style="--title-size: __TITLE_SIZE__px;">__TITLE__</h1>
      __THREAT_BLOCK__
    </div>

    <div class="bottom">
      <span>__META_LINE__</span>
      <span class="domain">discammer.com</span>
    </div>
  </div>
</body>
</html>
