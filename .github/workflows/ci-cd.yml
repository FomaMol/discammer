name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual, opt-in run. Its only extra power is seeding the Q1 Linux visual
  # baselines (see the `e2e` job). It CANNOT deploy: the `deploy` job is pinned
  # to `github.event_name == 'push'` on main, and `smoke-prod` needs `deploy`.
  workflow_dispatch:
    inputs:
      seed_visual_baselines:
        description: "Q1: regenerate the Linux visual baselines (--update-snapshots) and upload them as the visual-baselines-linux artifact for the owner to commit. Does not deploy."
        type: boolean
        default: false

# Least privilege by default: every job gets a read-only GITHUB_TOKEN. Only the
# docker-build job raises it, for OIDC (id-token: write) on the main push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit (supply chain)
    runs-on: ubuntu-latest
    # No `needs:` — runs in parallel with the test/build jobs so a known-vuln
    # dependency fails the pipeline fast, before prod. Policy + thresholds live
    # in docs/deploy/security-audit.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit (pinned)
        # Pin the audit tool itself: an unpinned auditor is its own
        # supply-chain hole, and a silent tool bump could flip CI red/green
        # without a code change. Bump deliberately, same policy as our deps.
        run: pip install pip-audit==2.10.1

      - name: Python dependency audit (blocking — fails on any known vuln)
        # Audits BOTH the prod pins and the dev-only test deps. pip-audit exits
        # non-zero on any vulnerability it finds; we do NOT `|| true` here, so a
        # known-vuln pin fails the job. To ship past an advisory that has no fix
        # yet, add a justified, time-boxed `--ignore-vuln <ID>` here (see the
        # docs). There are currently no ignores: the tree audits clean.
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Python audit report (informational — moderates, never blocks)
        # Same scan, full report, never fails the job. Moderates and below are
        # surfaced in the logs for triage without blocking the pipeline.
        if: always()
        run: pip-audit -r requirements.txt -r requirements-dev.txt --desc || true

      # SEC-4 — static application security testing (SAST). Non-blocking by
      # design (|| true): SEC-4 says "non-blocking сначала" — we triage findings
      # before turning any rule into a gate. bandit = Python security linter;
      # semgrep = pattern rules incl. FastAPI/XSS. Scope to our code (backend/,
      # scripts/), never the vendored .venv.
      #
      # Each scan now writes a machine-readable JSON report to sast-reports/ and
      # the whole dir uploads as an artifact (SEC-4 DoD: "отчёты в артефактах").
      # The log-only output these steps used to produce left nothing durable to
      # triage against or to diff run-over-run. The human-readable findings still
      # reach the log as well — see the per-step notes below.
      - name: Install SAST tools (pinned)
        # Non-fatal: SAST is informational for now, so a tool-install hiccup or a
        # pin that ages out must never block the supply-chain job. The scan steps
        # below tolerate the tool being absent (|| true), and the artifact upload
        # tolerates the reports being absent (if-no-files-found: ignore).
        if: always()
        run: pip install bandit==1.8.6 semgrep==1.139.0 || echo "::warning::SAST tools failed to install — scans skipped"

      - name: bandit (Python SAST — informational, JSON report)
        # Two passes on purpose. bandit 1.8.6 takes ONE -f at a time, and
        # `-f json -o FILE` prints only INFO lines to stdout — the findings
        # themselves would vanish from the log. So: pass 1 writes the durable
        # JSON artifact, pass 2 reproduces the previous screen output for
        # at-a-glance triage. The scan is ~4k LOC, so the second pass is cheap.
        # bandit exits non-zero when it finds anything; `|| true` keeps that
        # informational, exactly as before.
        if: always()
        run: |
          mkdir -p sast-reports
          bandit -r backend -x backend/.venv,backend/tests -ll \
            -f json -o sast-reports/bandit.json || true
          bandit -r backend -x backend/.venv,backend/tests -ll || true

      - name: semgrep (informational, JSON report)
        # One pass: --json-output writes the report file while the default
        # human-readable findings still stream to the log, so no second scan is
        # needed (verified against the pinned 1.139.0). semgrep exits 0 on
        # findings by default; `|| true` additionally covers a missing tool or a
        # registry fetch failure, keeping this non-blocking.
        if: always()
        run: |
          mkdir -p sast-reports
          semgrep --config p/python --config p/security-audit \
            --exclude backend/.venv --exclude backend/tests \
            --json-output=sast-reports/semgrep.json \
            backend scripts || true

      - name: Upload SAST reports (SEC-4)
        # The durable half of SEC-4's DoD. `warn`, not `ignore`: the scan steps
        # end in `|| true`, so a failed tool install produces no reports and the
        # artifact would silently vanish behind a green job — leaving "reports in
        # artifacts" looking satisfied while nothing was actually scanned. `warn`
        # surfaces that as an annotation without failing the job, so SAST stays
        # non-blocking (only `error` would colour it).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: sast-reports
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (blocking — fails on high/critical)
        # Prod deps only (--omit=dev): dev tooling vulns don't reach the
        # shipped bundle. Threshold is high — moderate is reported below.
        working-directory: frontend
        run: npm run audit

      - name: npm audit report (informational — moderates, never blocks)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate || true

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

      - name: CI/CD guard tests (bash, run against this workflow's own YAML)
        # Covers the production health-check SHA gate, the rollback path of the
        # SSH deploy script and the OIDC gating above. Needs ruby (preinstalled
        # on ubuntu-latest). See scripts/tests/ci_cd_guards.sh.
        run: bash scripts/tests/ci_cd_guards.sh

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Verify committed static is in sync
        run: git diff --exit-code -- backend/static || { echo "::error::backend/static is stale — run 'npm run build' in frontend/ and commit the result"; exit 1; }

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    # Runs ONLY on the main push. This job holds `id-token: write` (OIDC for the
    # ECR push role). A job-level `permissions` block cannot be conditional, so the
    # gate is the job-level `if`: on pull_request the job is skipped and never gets
    # an OIDC token. PR image builds are still exercised by the e2e job
    # (`docker compose up --build`). IAM trust is also limited to refs/heads/main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_registry: ${{ steps.ecr.outputs.registry }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.meta.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Short SHA
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: AWS credentials (main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-discammer-deploy
          aws-region: eu-central-1
      - name: ECR login (main push only)
        id: ecr
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (push to ECR on main)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.short }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          load: false
          tags: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && format('{0}/discammer-web:sha-{1}', steps.ecr.outputs.registry, github.sha) || format('discammer-web:ci-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    # SEC-2: Playwright drives all traffic from one source IP (no nginx in CI),
    # so disable the origin /api/* rate limit here — otherwise the shared bucket
    # would throttle the run. docker-compose.yml reads this at `up` time.
    env:
      API_RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      - name: Build and start the app (docker compose)
        run: docker compose up -d --build

      - name: Wait for /api/health
        run: |
          # Poll the health endpoint until it returns 200 (~60s budget).
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/api/health" || echo 000)
            echo "Attempt $i: GET /api/health -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose logs
          exit 1

      - name: Assert non-root container + seeded health (A1 proof)
        run: |
          # Hard proof that the self-healing entrypoint dropped privileges: the
          # running app process must be the app uid 10001, NOT root (0). If a
          # bare USER directive or a forced compose `user:` regressed this, the
          # uid would differ and this fails.
          #
          # NB: we inspect PID 1 (the gosu-dropped uvicorn), NOT a fresh
          # `docker compose exec ... id -u`. With no USER directive in the image,
          # `exec` starts a NEW process as the image default user (root, uid 0)
          # and would mis-report 0 even though the app correctly runs as 10001.
          # The entrypoint `exec gosu`s uvicorn, so uvicorn IS PID 1 at uid 10001
          # — /proc/1/status (field 2 of the Uid: line = real uid) is the truth.
          uid=$(docker compose exec -T web cat /proc/1/status | awk '/^Uid:/{print $2; exit}' | tr -d '\r')
          echo "Container PID 1 (uvicorn) uid: $uid"
          if [ "$uid" != "10001" ]; then
            echo "::error::container process uid is '$uid', expected 10001 (non-root). The entrypoint did not drop privileges correctly."
            docker compose logs
            exit 1
          fi
          # And prove the non-root process actually seeded the bind-mounted DB:
          # /api/health must be 200 with db:ok and non-zero content counts.
          body=$(curl -s --max-time 5 "http://127.0.0.1:8000/api/health")
          echo "Health body: $body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::health status not ok"; docker compose logs; exit 1; }
          echo "$body" | grep -q '"db":"ok"'     || { echo "::error::db not ok — seed under app uid failed"; docker compose logs; exit 1; }
          # Seeded counts must be present and > 0 (db wrote discammer.db as 10001).
          posts=$(echo "$body" | sed -n 's/.*"posts":\([0-9]*\).*/\1/p')
          guides=$(echo "$body" | sed -n 's/.*"guides":\([0-9]*\).*/\1/p')
          modules=$(echo "$body" | sed -n 's/.*"modules":\([0-9]*\).*/\1/p')
          echo "Seeded counts: posts=$posts guides=$guides modules=$modules"
          if [ -z "$posts" ] || [ "$posts" -le 0 ] || [ -z "$guides" ] || [ "$guides" -le 0 ] || [ -z "$modules" ] || [ "$modules" -le 0 ]; then
            echo "::error::seeded content counts missing or zero — the non-root process did not seed the DB"
            docker compose logs
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci || npm install

      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          # Point at the compose-served app; this skips the config's local
          # uvicorn webServer entirely.
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      # ---- Q1: visual regression (SELF-ARMING) -------------------------------
      # Playwright names snapshots per-OS. The committed baselines are *-darwin
      # (macOS dev box); CI is Linux, so without *-linux baselines every run
      # would fail on "missing snapshot". The gate therefore arms itself off the
      # baselines actually committed to the repo, instead of a hand-flipped
      # `continue-on-error: true` that someone must remember to revert:
      #
      #   0 committed *-linux.png -> NON-BLOCKING (diffs uploaded, job stays green)
      #   >0 committed *-linux.png -> BLOCKING (a real visual regression fails e2e)
      #
      # So the ONLY remaining owner step is to seed the baselines; the gate goes
      # live in the same commit that adds them, with no second workflow edit.
      #
      # SEEDING (owner action, from the Actions tab): run this workflow via
      # "Run workflow" with seed_visual_baselines = true. That run regenerates
      # the Linux baselines and uploads them as `visual-baselines-linux`;
      # download, unzip into e2e/visual.spec.ts-snapshots/, and commit. The
      # seeding run is forced non-blocking (it defines the baseline, so it has
      # nothing to compare against). Full runbook:
      # docs/deploy/visual-regression.md.
      #
      # The visual spec runs only under its dedicated config (which sets
      # PW_VISUAL); the default `npx playwright test` above skips it.
      - name: Decide visual-regression mode (Q1)
        id: visual_mode
        env:
          SEED: ${{ github.event.inputs.seed_visual_baselines }}
        run: |
          # `github.event.inputs` is null on push/PR, so SEED is empty there and
          # this can only ever be a seeding run via workflow_dispatch.
          count=$(find e2e/visual.spec.ts-snapshots -name '*-linux.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "Committed Linux visual baselines: ${count:-0}"
          if [ "$SEED" = "true" ]; then
            echo "::notice::Q1 seeding run — regenerating Linux baselines (--update-snapshots). Gate forced non-blocking; download the visual-baselines-linux artifact and commit it."
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          elif [ "${count:-0}" -gt 0 ]; then
            echo "Q1 visual gate: BLOCKING (${count} Linux baselines committed)."
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "blocking=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Q1 visual gate is NON-BLOCKING — no *-linux.png baselines are committed, so CI is NOT proving visual parity. Seed them by running this workflow with seed_visual_baselines=true (see docs/deploy/visual-regression.md)."
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Visual regression (Q1 — blocking once Linux baselines are committed)
        id: visual
        continue-on-error: ${{ steps.visual_mode.outputs.blocking != 'true' }}
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          UPDATE: ${{ steps.visual_mode.outputs.update }}
        run: |
          if [ "$UPDATE" = "true" ]; then
            npx playwright test visual.spec.ts -c visual.config.ts --update-snapshots
          else
            npx playwright test visual.spec.ts -c visual.config.ts
          fi

      - name: Upload generated Linux baselines (Q1 seeding run only)
        if: always() && github.event.inputs.seed_visual_baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          retention-days: 7
          # `warn`, not `ignore`: an empty seeding run means the seeding failed,
          # and that must be visible rather than silently producing nothing.
          if-no-files-found: warn

      - name: Upload visual diffs (Q1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      # ---- Q2: Lighthouse CI budgets (blocking) ------------------------------
      # The app is already served by docker compose on :8000 in this job, so we
      # audit it in place. scripts/lhci.sh resolves the Playwright-managed Chrome
      # (installed above) and runs @lhci/cli with the budgets in lighthouserc.json
      # as assertions. Floors are a ratchet set below the measured prod scores —
      # see docs/deploy/visual-regression.md (Q2 section).
      - name: Lighthouse CI budgets (Q2)
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash scripts/lhci.sh

      - name: Upload Lighthouse report (Q2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright test-results (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # `audit` is included so a known-vuln dependency actually BLOCKS the deploy
    # (R1 finding): without it the audit job ran in parallel and a failed audit
    # left the deploy chain free to ship. Branch protection isn't available on
    # this private/free-tier repo, so `needs:` is the only working gate.
    needs: [audit, backend-tests, frontend-build, docker-build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy
        # Pinned by commit SHA: this third-party action receives the prod SSH
        # key, and a moved tag must not be able to swap the code under it.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # The image is pulled by digest from ECR (pushed by docker-build on main),
          # never built on the host. Cloudflare purge is non-fatal, as before.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          IMAGE_REGISTRY: ${{ needs.docker-build.outputs.image_registry }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
          GIT_SHORT: ${{ needs.docker-build.outputs.short_sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: CF_API_TOKEN,CF_ZONE_ID,IMAGE_REGISTRY,IMAGE_DIGEST,GIT_SHORT,DEPLOY_RUN
          command_timeout: 18m
          script: |
            set -euo pipefail
            ENV_FILE=/etc/discammer/deployment.env
            COMPOSE=/etc/discammer/compose.yaml
            NEW="${IMAGE_REGISTRY}/discammer-web@${IMAGE_DIGEST}"
            [[ "$NEW" =~ ^[0-9]{12}\.dkr\.ecr\.eu-central-1\.amazonaws\.com/discammer-web@sha256:[a-f0-9]{64}$ ]]
            [[ "$GIT_SHORT" =~ ^[0-9a-f]{7}$ ]]
            [[ "$DEPLOY_RUN" =~ ^[0-9]+-[0-9]+$ ]]
            # /etc/discammer is root-only (700): compose reads the env file as root via
            # --env-file, the ssh user never sources it.
            apply() {
              sudo docker compose --env-file "$ENV_FILE" -p discammer-staging -f "$COMPOSE" up -d --no-build --pull never
            }
            health_ok() {
              local v=""
              for _ in $(seq 1 40); do
                v=$(curl -fsS --max-time 5 http://127.0.0.1:8000/api/health 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
                [ "$v" = "$1" ] && return 0
                sleep 3
              done
              echo "health version is '${v}', expected '$1'"
              return 1
            }
            # After a rollback there is no expected version to compare (the env file
            # keeps only the image digest), so require HTTP 200 on the restored image.
            health_up() {
              local _
              for _ in $(seq 1 40); do
                curl -fsS --max-time 5 http://127.0.0.1:8000/api/health >/dev/null 2>&1 && return 0
                sleep 3
              done
              return 1
            }
            # Keep the public gate in this SSH transaction. A separate failing
            # Actions step would leave the new image and editorial rows live.
            public_ok() {
              local path code deployed expected="$GIT_SHORT"
              for _ in $(seq 1 10); do
                code=$(curl -sL -A 'Mozilla/5.0' --max-time 15 -o /dev/null -w '%{http_code}' https://discammer.com/ || echo 000)
                [ "$code" = 200 ] && break
                sleep 5
              done
              [ "$code" = 200 ] || { echo 'public home did not return 200'; return 1; }
              for path in /api/health /en/ /ru/ /en/journal /ru/journal /en/course /en/game /api/posts /api/guides; do
                code=$(curl -sL -A 'Mozilla/5.0' --max-time 15 -o /dev/null -w '%{http_code}' "https://discammer.com${path}" || echo 000)
                echo "GET ${path} -L -> HTTP $code"
                [ "$code" = 200 ] || return 1
              done
              deployed=$(curl -sL -A 'Mozilla/5.0' --max-time 15 https://discammer.com/api/health \
                | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
              echo "expected SHA: ${expected} | domain reports: ${deployed:-<none>}"
              [ "${#deployed}" -ge 7 ] && [[ "$deployed" = "$expected"* ]]
            }
            # Verify the effective setting in the currently serving A image
            # before booting B. Startup reseeding would rewrite editorial rows
            # before the targeted 110-row snapshot could be taken.
            CURRENT_CID=$(sudo docker compose --env-file "$ENV_FILE" -p discammer-staging -f "$COMPOSE" ps -q web || true)
            if [ -z "$CURRENT_CID" ] || ! sudo docker exec -u 10001 "$CURRENT_CID" python -c 'import sys; sys.path.insert(0, "/app/backend"); import config; assert not config.SEED_ON_STARTUP, "SEED_ON_STARTUP must be false"'; then
              echo "::error::effective production SEED_ON_STARTUP is enabled or current web container is missing; no image change made"
              exit 1
            fi
            rollback_image() {
              sudo cp -p "$ENV_FILE.prev" "$ENV_FILE"
              if apply && health_up; then
                echo "::warning::previous image restored and probed: ${PREV}"
              else
                echo "::error::ROLLBACK FAILED: ${PREV} did not come up healthy; manual repair required"
              fi
              exit 1
            }
            PREV=$(sudo grep -E '^DISCAMMER_IMAGE=' "$ENV_FILE" | cut -d= -f2-)
            echo "previous image: ${PREV}"
            echo "new image:      ${NEW}"
            aws ecr get-login-password --region eu-central-1 | sudo docker login --username AWS --password-stdin "$IMAGE_REGISTRY" >/dev/null
            sudo docker pull "$NEW" >/dev/null
            sudo cp -p "$ENV_FILE" "$ENV_FILE.prev"
            sudo sed -i "s|^DISCAMMER_IMAGE=.*|DISCAMMER_IMAGE=${NEW}|" "$ENV_FILE"
            if ! apply || ! health_ok "$GIT_SHORT"; then
              echo "::error::deploy failed; rolling back to ${PREV}"
              sudo cp -p "$ENV_FILE.prev" "$ENV_FILE"
              # A failed rollback must not be swallowed (this used to be `apply || true`).
              # Re-apply the restored image and probe it; say loudly if the host is not back.
              if apply && health_up; then
                echo "::warning::rolled back to ${PREV}; /api/health answers 200 on this host"
              else
                echo "::error::ROLLBACK FAILED on this host: ${PREV} did not come up healthy. Manual action is required before any further deploy."
              fi
              exit 1
            fi
            # Validate effective seed config, all 110 authored lesson rows and
            # exact DB keys before either editorial update. The course updater
            # snapshots only changed lesson rows on the persistent mount.
            CID=$(sudo docker compose --env-file "$ENV_FILE" -p discammer-staging -f "$COMPOSE" ps -q web || true)
            COURSE_PREFLIGHT_OUTPUT=""
            if [ -z "$CID" ] || ! COURSE_PREFLIGHT_OUTPUT=$(sudo docker exec -u 10001 "$CID" python /app/backend/editorial_course_sync.py --dry-run); then
              echo "::error::course preflight failed or web container missing; rolling back image"
              sudo cp -p "$ENV_FILE.prev" "$ENV_FILE"
              if apply && health_up; then
                echo "::warning::previous image restored after course preflight failure"
              else
                echo "::error::ROLLBACK FAILED after course preflight failure; manual repair required"
              fi
              exit 1
            fi
            echo "$COURSE_PREFLIGHT_OUTPUT"
            COURSE_BEFORE_CHANGED=$(printf '%s' "$COURSE_PREFLIGHT_OUTPUT" | sed -n 's/.*"changed": \([0-9][0-9]*\).*/\1/p')
            if ! [[ "$COURSE_BEFORE_CHANGED" =~ ^[0-9]+$ ]]; then
              echo "::error::course preflight count is unavailable; retaining the new image"
              exit 1
            fi
            BACKUP="/app/data/poster-backup-${GIT_SHORT}.json"
            # A nonzero docker-exec exit does not prove that SQLite rolled back:
            # the transaction may commit before stdout or SSH transport fails.
            # Record the exact 14-row state before apply, then resolve it again
            # before every image rollback after this point.
            BEFORE_STATE=""
            if [ -z "$CID" ] || ! BEFORE_STATE=$(sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py status); then
              echo "::error::web container missing or editorial preflight failed"
              rollback_image
            fi
            case "$BEFORE_STATE" in old|new) ;; *) echo "::error::unknown editorial preflight state"; rollback_image ;; esac
            revert_editorial_if_needed() {
              local current
              current=$(sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py status 2>/dev/null) || return 1
              if [ "$BEFORE_STATE" = new ]; then
                [ "$current" = new ]
                return
              fi
              case "$current" in
                old) return 0 ;;
                new)
                  # Restore only the snapshot created by this commit's attempt.
                  # If restore commits but its output fails, trust a fresh row
                  # check, not the command's exit code.
                  sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py restore --backup "$BACKUP" || true
                  current=$(sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py status 2>/dev/null) || return 1
                  [ "$current" = old ]
                  ;;
                *) return 1 ;;
              esac
            }
            MIGRATION_OUTPUT=""
            if ! MIGRATION_OUTPUT=$(sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py apply --backup "$BACKUP"); then
              echo "::error::editorial poster command failed; checking committed row state"
              if ! revert_editorial_if_needed; then
                echo "::error::ROLLBACK FAILED: editorial state could not be proved compatible with the previous image; retaining the new image"
                exit 1
              fi
              rollback_image
            fi
            echo "$MIGRATION_OUTPUT"
            if [ "$(sudo docker exec -u 10001 "$CID" python /app/backend/poster_migration.py status 2>/dev/null || true)" != new ]; then
              echo "::error::ROLLBACK FAILED: poster apply lacks a provable new row state; retaining the new image"
              exit 1
            fi
            # A must already have published posters before B owns release.
            if [ "$BEFORE_STATE" != new ]; then
              echo "::error::A poster rows were not already live; restoring this attempt"
              if ! revert_editorial_if_needed; then
                echo "::error::ROLLBACK FAILED: out-of-order poster update could not be restored; retaining the new image"
                exit 1
              fi
              rollback_image
            fi
            # Run and attempt keep this snapshot exclusive to this deploy,
            # including a GitHub rerun of the same commit.
            COURSE_SNAPSHOT="/app/data/course-release-snapshots/course-editorial-before-${GIT_SHORT}-${DEPLOY_RUN}.json"
            # Keep rollback snapshots root-owned and 0600 on the persistent
            # mount; the serving web UID must not be able to rewrite them.
            course_state() {
              sudo docker exec -u 0 "$CID" python /app/backend/editorial_course_sync.py --status --snapshot "$COURSE_SNAPSHOT"
            }
            restore_course_if_needed() {
              local current
              current=$(course_state 2>/dev/null) || return 1
              case "$current" in
                absent) [ "$COURSE_BEFORE_CHANGED" -eq 0 ] ;;
                original) return 0 ;;
                applied)
                  # The restore command can also commit before reporting an
                  # error. Re-read exact rows before deciding image safety.
                  sudo docker exec -u 0 "$CID" python /app/backend/editorial_course_sync.py --restore --snapshot "$COURSE_SNAPSHOT" || true
                  current=$(course_state 2>/dev/null) || return 1
                  [ "$current" = original ]
                  ;;
                *) return 1 ;;
              esac
            }
            COURSE_OUTPUT=""
            if ! COURSE_OUTPUT=$(sudo docker exec -u 0 "$CID" python /app/backend/editorial_course_sync.py --apply --snapshot "$COURSE_SNAPSHOT"); then
              # A command may report failure after SQLite committed (for
              # example, closed stdout). Reconcile this attempt's snapshot
              # before selecting the prior A image.
              echo "::error::course editorial update command failed; reconciling exact attempt state"
              if ! restore_course_if_needed; then
                echo "::error::ROLLBACK FAILED: course state could not be proved restored; retaining the new image"
                exit 1
              fi
              sudo cp -p "$ENV_FILE.prev" "$ENV_FILE"
              if apply && health_up; then
                echo "::warning::previous image restored after course editorial failure"
              else
                echo "::error::ROLLBACK FAILED after course editorial failure; manual repair required"
              fi
              exit 1
            fi
            echo "$COURSE_OUTPUT"
            COURSE_CHANGED=$(printf '%s' "$COURSE_OUTPUT" | sed -n 's/.*"changed": \([0-9][0-9]*\).*/\1/p')
            if ! [[ "$COURSE_CHANGED" =~ ^[0-9]+$ ]]; then
              echo "::error::ROLLBACK FAILED: cannot parse course update result; retaining the new image for inspection"
              exit 1
            fi
            if [ "$COURSE_CHANGED" -ne "$COURSE_BEFORE_CHANGED" ]; then
              echo "::error::ROLLBACK FAILED: course preflight and update counts disagree; retaining the new image"
              exit 1
            fi
            COURSE_STATE=$(course_state 2>/dev/null) || {
              echo "::error::ROLLBACK FAILED: course update state cannot be verified; retaining the new image"
              exit 1
            }
            if { [ "$COURSE_CHANGED" -gt 0 ] && [ "$COURSE_STATE" != applied ]; } ||
               { [ "$COURSE_CHANGED" -eq 0 ] && [ "$COURSE_STATE" != absent ]; }; then
              echo "::error::ROLLBACK FAILED: course update result and exact row state disagree; retaining the new image"
              exit 1
            fi
            echo "health ok: version ${GIT_SHORT}"
            if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ZONE_ID:-}" ]; then
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
                --data '{"purge_everything":true}' >/dev/null || echo "::warning::Cloudflare purge failed (non-fatal)"
            fi
            if ! public_ok; then
              echo "::error::public verification failed; restoring the exact editorial rows changed by this attempt before image rollback"
              if ! restore_course_if_needed; then
                echo "::error::ROLLBACK FAILED: course rows could not be proved restored; retaining the new image"
                exit 1
              fi
              if ! revert_editorial_if_needed; then
                echo "::error::ROLLBACK FAILED: editorial state could not be proved compatible with the previous image; retaining the new image"
                exit 1
              fi
              rollback_image
            fi

  smoke-prod:
    name: Post-deploy production smoke (O3)
    runs-on: ubuntu-latest
    needs: [deploy]
    # Only after a real deploy (push to main). The deploy job's own curl health
    # check already passed; this runs the @smoke Playwright slice against the
    # LIVE site for a deeper, browser-level check (every page 200, /api/health
    # reports the just-deployed SHA, zero console errors, an island hydrates).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci || npm install

      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Smoke production (read-only, @smoke specs)
        # READ-ONLY: the @smoke tests are GET + passive assertions only — no
        # writes, no analyzer/URL input (privacy). A failure marks the run
        # failed; it does NOT auto-rollback — deploy.sh already restored :prev
        # in-box on a failed health probe. SMOKE_EXPECT_SHA pins the run to the
        # commit we just deployed so a stale image is caught: deploy.sh stamps
        # the SHORT sha via `git rev-parse --short HEAD`, so pass the short form.
        env:
          BASE_URL: https://discammer.com
          SMOKE_EXPECT_SHA: ${{ github.sha }}
        run: |
          # deploy.sh stamps the 7-char short sha; github.sha is the full sha.
          # The smoke test accepts a short-prefix match, but normalize here too
          # so the env passed in is the short form the box reports.
          export SMOKE_EXPECT_SHA="${SMOKE_EXPECT_SHA:0:7}"
          echo "Smoking https://discammer.com for deployed SHA ${SMOKE_EXPECT_SHA}"
          bash scripts/smoke-prod.sh

      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-prod-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
