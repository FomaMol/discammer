{% extends "base.html" %}
{% block title %}404 - File Not Found - DiScammer{% endblock %}
{% block content %}

<div class="min-h-[60vh] flex items-center justify-center">
  <div class="text-center px-4 sm:px-6">
    <!-- 404 Number -->
    <h1 class="font-['Press_Start_2P'] text-5xl sm:text-6xl text-[#FF4757] glow-red">404</h1>

    <!-- Subtitle -->
    <p class="font-['JetBrains_Mono'] text-[#8892A8] text-base sm:text-lg mt-4 uppercase tracking-wider">FILE NOT FOUND</p>

    <!-- Description -->
    <p class="font-['JetBrains_Mono'] text-xs sm:text-sm text-[#4A5568] mt-4 break-words">&gt; The requested resource does not exist in this system.</p>

    <!-- Return Button -->
    <a href="/"
       class="inline-block mt-6 sm:mt-8 px-5 sm:px-6 py-3 font-['JetBrains_Mono'] uppercase text-xs sm:text-sm tracking-wider bg-transparent border border-[#00F0FF] text-[#00F0FF] hover:shadow-[0_0_20px_rgba(0,240,255,0.2)] transition-all duration-300">
      &larr; RETURN TO BASE
    </a>
  </div>
</div>

{% endblock %}
