<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#f29587" role="img" aria-label="DiScammer">
  <!--
    DiScammer logomark — "strike-through D".
    A block-mono D (soft red) marked with an analyst's horizontal strike (amber):
    "scammer detected, struck from the record". The strike overshoots the D on both sides
    so the redaction reads as annotation, not as a serif. Reads at 16px (favicon),
    24px (nav), 32px (PWA), 64px (OG). Two paths total.
  -->
  <!-- Block D — outer perimeter with an inner counter, evenodd carves the hole. -->
  <path
    fill-rule="evenodd"
    d="M4 3 H16 a5 5 0 0 1 5 5 V16 a5 5 0 0 1 -5 5 H4 Z
       M8 7 H15 a1.5 1.5 0 0 1 1.5 1.5 V15.5 a1.5 1.5 0 0 1 -1.5 1.5 H8 Z"/>
  <!-- Strike-through — amber annotation bar; overshoots the D's bounds left and right. -->
  <rect x="2" y="10.75" width="21" height="2.5" fill="#f4b965"/>
</svg>
