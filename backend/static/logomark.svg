<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="DiScammer">
  <!-- Cursor block: solid cyan rectangle, the live caret of a console session -->
  <rect x="3" y="4" width="11" height="13" rx="0.5"/>
  <!-- Prompt underscore: a short cursor bar, suggesting the line where input lands -->
  <rect x="3" y="19" width="18" height="2" rx="0.5"/>
</svg>
