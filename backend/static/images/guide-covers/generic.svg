<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Threat Profile">
  <!-- Canvas -->
  <rect width="1200" height="630" fill="#0b0f1a"/>

  <g stroke="#202a44" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <text x="80" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="600" letter-spacing="3" fill="#6b7588">// GENERIC</text>
  <text x="1120" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2.5" fill="#475064" text-anchor="end">DCM-OPS · THREAT_DB</text>

  <!-- Centered case-file glyph: a folder outline with an exclamation triangle inset -->
  <g transform="translate(600 315)" stroke="#65def0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Folder tab -->
    <polyline points="-180,-90 -80,-90 -50,-60 180,-60"/>
    <!-- Folder body -->
    <path d="M -180 -90 L -180 130 L 180 130 L 180 -60"/>
  </g>

  <!-- Exclamation triangle (amber — caution marker) -->
  <g transform="translate(600 330)" stroke="#f4b965" stroke-width="10" stroke-linejoin="round" fill="none">
    <polygon points="0,-50 60,55 -60,55"/>
  </g>
  <line x1="600" y1="305" x2="600" y2="340" stroke="#f4b965" stroke-width="10" stroke-linecap="round"/>
  <circle cx="600" cy="365" r="6" fill="#f4b965"/>

  <text x="600" y="540" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="36" font-weight="800" letter-spacing="-1" text-anchor="middle" fill="#e7ecf5">THREAT PROFILE</text>
  <text x="600" y="580" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="3" text-anchor="middle" fill="#3a8b9a">DCM-OPS · CASE FILE</text>
</svg>
