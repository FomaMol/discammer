<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phone Scams">
  <!-- Canvas -->
  <rect width="1200" height="630" fill="#0b0f1a"/>

  <g stroke="#202a44" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <text x="80" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="600" letter-spacing="3" fill="#6b7588">// PHONE</text>
  <text x="1120" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2.5" fill="#475064" text-anchor="end">DCM-OPS · THREAT_DB</text>

  <!-- Phone block (modern handset / smartphone rectangle) with question mark on the screen -->
  <g transform="translate(600 315)" stroke="#65def0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Phone body -->
    <rect x="-90" y="-150" width="180" height="300" rx="22"/>
    <!-- Earpiece indicator -->
    <line x1="-18" y1="-122" x2="18" y2="-122"/>
    <!-- Home button -->
    <circle cx="0" cy="120" r="10"/>
    <!-- Question mark on screen -->
    <path d="M -28 -40 Q -28 -70 0 -70 Q 28 -70 28 -40 Q 28 -20 0 -10 L 0 20" stroke="#f4b965" stroke-width="14"/>
    <circle cx="0" cy="50" r="7" fill="#f4b965" stroke="none"/>
  </g>

  <!-- Outgoing signal arcs -->
  <g transform="translate(600 315)" stroke="#3a8b9a" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 130 -90 Q 170 -50 130 -10"/>
    <path d="M 165 -110 Q 220 -50 165 10"/>
  </g>

  <text x="600" y="540" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="36" font-weight="800" letter-spacing="-1" text-anchor="middle" fill="#e7ecf5">PHONE SCAMS</text>
  <text x="600" y="580" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="3" text-anchor="middle" fill="#3a8b9a">THREAT PROFILE · CASE FILE</text>
</svg>
