<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Investment Fraud">
  <!-- Canvas -->
  <rect width="1200" height="630" fill="#151314"/>

  <g stroke="#544447" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <text x="80" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="600" letter-spacing="3" fill="#b6a29d">// INVESTMENT</text>
  <text x="1120" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2.5" fill="#b6a29d" text-anchor="end">DCM-OPS · THREAT_DB</text>

  <!-- Upward arrow with a vertical crack across the shaft — promised line vs the break.
       The arrow is drawn first; the crack rendered in canvas color overlay so it shows as a "break". -->
  <g transform="translate(600 315)" stroke="#f29587" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Shaft -->
    <line x1="0" y1="150" x2="0" y2="-120"/>
    <!-- Arrowhead -->
    <polyline points="-60,-60 0,-120 60,-60"/>
  </g>
  <!-- Crack: zig-zag through the shaft, rendered in canvas color to "break" it -->
  <polyline points="-30,40 0,30 -30,10 30,0 -10,-20 20,-30" transform="translate(600 315)" stroke="#151314" stroke-width="22" fill="none" stroke-linejoin="round"/>
  <!-- Thin crack outline in amber to make the break legible -->
  <polyline points="-30,40 0,30 -30,10 30,0 -10,-20 20,-30" transform="translate(600 315)" stroke="#f4b965" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="600" y="540" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="36" font-weight="800" letter-spacing="-1" text-anchor="middle" fill="#ede5e3">INVESTMENT FRAUD</text>
  <text x="600" y="580" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="3" text-anchor="middle" fill="#c17f77">THREAT PROFILE · CASE FILE</text>
</svg>
