<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Online Fraud">
  <!-- Canvas -->
  <rect width="1200" height="630" fill="#151314"/>

  <g stroke="#544447" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <text x="80" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" font-weight="600" letter-spacing="3" fill="#b6a29d">// ONLINE</text>
  <text x="1120" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2.5" fill="#b6a29d" text-anchor="end">DCM-OPS · THREAT_DB</text>

  <!-- Empty shopping cart -->
  <g transform="translate(600 315)" stroke="#f29587" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Handle bar from upper-left -->
    <polyline points="-180,-80 -120,-80 -90,40 100,40 130,-30 -70,-30"/>
    <!-- Wheels -->
    <circle cx="-60" cy="100" r="20"/>
    <circle cx="80" cy="100" r="20"/>
    <!-- Empty marker: a faint cross inside the basket to signal "empty / missing item" -->
    <line x1="-30" y1="-5" x2="40" y2="15" stroke="#c17f77" stroke-width="6" stroke-dasharray="6 6"/>
    <line x1="40" y1="-5" x2="-30" y2="15" stroke="#c17f77" stroke-width="6" stroke-dasharray="6 6"/>
  </g>

  <text x="600" y="540" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="36" font-weight="800" letter-spacing="-1" text-anchor="middle" fill="#ede5e3">ONLINE FRAUD</text>
  <text x="600" y="580" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="500" letter-spacing="3" text-anchor="middle" fill="#c17f77">THREAT PROFILE · CASE FILE</text>
</svg>
