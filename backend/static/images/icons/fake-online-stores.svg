<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Shopping cart body -->
  <rect x="4" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="6" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="6" y="10" width="2" height="2" fill="#00F0FF"/>
  <rect x="8" y="10" width="2" height="2" fill="#00F0FF"/>
  <rect x="8" y="12" width="16" height="2" fill="#00F0FF"/>
  <rect x="8" y="14" width="2" height="2" fill="#00F0FF"/>
  <rect x="24" y="14" width="2" height="2" fill="#00F0FF"/>
  <rect x="8" y="16" width="2" height="2" fill="#00F0FF"/>
  <rect x="24" y="16" width="2" height="2" fill="#00F0FF"/>
  <rect x="10" y="18" width="2" height="2" fill="#00F0FF"/>
  <rect x="22" y="18" width="2" height="2" fill="#00F0FF"/>
  <rect x="10" y="20" width="14" height="2" fill="#00F0FF"/>
