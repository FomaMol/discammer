  <rect x="17" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="11" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="19" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="11" y="6" width="10" height="2" fill="#00F0FF"/>
  <!-- Exclamation in triangle -->
  <rect x="15" y="3" width="2" height="2" fill="#00F0FF"/>
