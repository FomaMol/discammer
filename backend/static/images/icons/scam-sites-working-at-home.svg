<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- House roof -->
  <rect x="14" y="0" width="4" height="2" fill="#00F0FF"/>
  <rect x="12" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="18" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="10" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="20" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="8" y="6" width="2" height="2" fill="#00F0FF"/>
  <rect x="22" y="6" width="2" height="2" fill="#00F0FF"/>
  <rect x="6" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="24" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="4" y="10" width="2" height="2" fill="#00F0FF"/>
  <rect x="26" y="10" width="2" height="2" fill="#00F0FF"/>
  <!-- House base -->
  <rect x="4" y="12" width="24" height="2" fill="#00F0FF"/>
  <rect x="6" y="14" width="2" height="12" fill="#00F0FF"/>
  <rect x="24" y="14" width="2" height="12" fill="#00F0FF"/>
  <rect x="6" y="26" width="20" height="2" fill="#00F0FF"/>
  <!-- Door -->
  <rect x="14" y="20" width="4" height="8" fill="#00F0FF"/>
  <!-- Laptop screen inside house -->
  <rect x="10" y="16" width="2" height="2" fill="#00F0FF"/>
  <rect x="20" y="16" width="2" height="2" fill="#00F0FF"/>
  <!-- Warning triangle above house -->
  <rect x="28" y="0" width="2" height="2" fill="#00F0FF"/>
  <rect x="26" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="30" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="26" y="4" width="6" height="2" fill="#00F0FF"/>
  <!-- Exclamation in warning -->
  <rect x="28" y="2" width="2" height="1" fill="#00F0FF"/>
  <rect x="28" y="4" width="2" height="1" fill="#00F0FF"/>
</svg>
