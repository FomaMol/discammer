<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Phone body -->
  <rect x="8" y="2" width="2" height="28" fill="#00F0FF"/>
  <rect x="22" y="2" width="2" height="28" fill="#00F0FF"/>
  <rect x="10" y="0" width="12" height="2" fill="#00F0FF"/>
  <rect x="10" y="30" width="12" height="2" fill="#00F0FF"/>
  <!-- Screen area top/bottom -->
  <rect x="10" y="4" width="12" height="2" fill="#00F0FF"/>
  <rect x="10" y="24" width="12" height="2" fill="#00F0FF"/>
  <!-- Home button -->
  <rect x="14" y="26" width="4" height="2" fill="#00F0FF"/>
  <!-- Alert symbol on screen - exclamation -->
  <rect x="15" y="8" width="2" height="8" fill="#00F0FF"/>
  <rect x="15" y="18" width="2" height="2" fill="#00F0FF"/>
  <!-- Alert circle around exclamation -->
  <rect x="12" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="18" y="8" width="2" height="2" fill="#00F0FF"/>
  <rect x="12" y="18" width="2" height="2" fill="#00F0FF"/>
  <rect x="18" y="18" width="2" height="2" fill="#00F0FF"/>
  <rect x="10" y="10" width="2" height="8" fill="#00F0FF"/>
  <rect x="20" y="10" width="2" height="8" fill="#00F0FF"/>
  <!-- Signal waves -->
  <rect x="26" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="28" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="28" y="6" width="2" height="2" fill="#00F0FF"/>
  <rect x="4" y="4" width="2" height="2" fill="#00F0FF"/>
  <rect x="2" y="2" width="2" height="2" fill="#00F0FF"/>
  <rect x="2" y="6" width="2" height="2" fill="#00F0FF"/>
</svg>
