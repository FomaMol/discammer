# =============================================================================
# DiScammer production nginx vhost
# =============================================================================
# Reconstructed from repo docs + deploy config. The live file lives on the
# server only; a server rebuild loses it. This is a best-known reconstruction.
#
# Every line tagged `# RECONCILE:` is inferred, not certain. Diff this against
# the live config (typically /etc/nginx/sites-enabled/discammer.conf) and
# reconcile each tagged line before `nginx -t` / reload. See README.md.
#
# Topology: nginx (host, TLS termination) -> reverse proxy to the app at
# 127.0.0.1:8000 (uvicorn in Docker, published to loopback by
# docker-compose.prod.yml). Large media (~15 GB videos/posters) is served by
# nginx directly from disk; everything else proxies to the app, including
# /static/* and the brotli-precompressed Unity game under /play/.
# =============================================================================

# --- shared proxy parameters ------------------------------------------------
# Defined once, reused in every proxy_pass location below.
#
# X-Forwarded-Proto MUST stay $scheme: uvicorn only trusts X-Forwarded-* from
# loopback, and the app relies on it to keep generating https:// redirects.
# (config.SITE_ORIGIN also hardcodes https://discammer.com as a backstop.)

upstream discammer_app {
    server 127.0.0.1:8000;       # RECONCILE: app published to loopback by docker-compose.prod.yml
    keepalive 16;                # RECONCILE: connection reuse to the app; harmless to drop
}

# gzip for nginx-generated / proxied *text* responses. Already-compressed
# proxied content (the brotli .br game chunks under /play/) is NOT matched by
# these MIME types, so their Content-Encoding: br passes through untouched.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/xml+rss
    application/rss+xml
    application/json
    application/javascript
    text/javascript
    image/svg+xml;
# Note: do NOT add gzip for application/wasm or .br assets — they are served
# pre-compressed by the app and re-compressing breaks Content-Encoding.

# =============================================================================
# HTTP :80 — ACME challenge passthrough + permanent redirect to HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name discammer.com www.discammer.com;   # RECONCILE: confirm IPv6 listen is wanted

    # Let's Encrypt / certbot webroot renewals must be served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;     # RECONCILE: certbot webroot path on the live host
        default_type "text/plain";
    }

    # Everything else -> HTTPS, preserving host + path.
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS :443 — www -> apex redirect
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # RECONCILE: confirm HTTP/2 is enabled on the live server
    server_name www.discammer.com;

    # Certbot-managed TLS (same cert covers apex + www).
    ssl_certificate     /etc/letsencrypt/live/discammer.com/fullchain.pem;       # RECONCILE: managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/discammer.com/privkey.pem;          # RECONCILE: managed by certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                  # RECONCILE: certbot-written ssl options
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                        # RECONCILE: certbot-written dhparam

    return 301 https://discammer.com$request_uri;
}

# =============================================================================
# HTTPS :443 — apex, the real site
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # RECONCILE: confirm HTTP/2 is enabled on the live server
    server_name discammer.com;

    # --- TLS (certbot / Let's Encrypt) --------------------------------------
    ssl_certificate     /etc/letsencrypt/live/discammer.com/fullchain.pem;       # RECONCILE: managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/discammer.com/privkey.pem;          # RECONCILE: managed by certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                  # RECONCILE: certbot-written ssl options
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                        # RECONCILE: certbot-written dhparam

    # --- Cloudflare Origin CA + Authenticated Origin Pulls (CF-3) -----------
    # ACTIVATE AFTER Cloudflare is fronting the site (see docs/cloudflare/SETUP.md
    # § CF-3). Replaces the certbot cert above with a 15-year Cloudflare Origin CA
    # cert (no renewal needed behind CF) and pins the connection so the origin
    # accepts TLS ONLY from Cloudflare (mTLS) — a second lock alongside the
    # CF-8 firewall. To switch: comment the four certbot lines above, then
    # uncomment the five lines below (paths must exist on the host first).
    #   ssl_certificate         /etc/ssl/cloudflare/discammer.pem;      # Origin CA cert
    #   ssl_certificate_key     /etc/ssl/cloudflare/discammer.key;      # Origin CA key
    #   ssl_protocols           TLSv1.2 TLSv1.3;
    #   ssl_verify_client       on;                                     # require CF client cert (Authenticated Origin Pulls)
    #   ssl_client_certificate  /etc/ssl/cloudflare/origin-pull-ca.pem; # CF's AOP CA (download from CF dashboard)

    # --- real client IP behind Cloudflare (CF-8) ----------------------------
    # Restore $remote_addr from CF-Connecting-IP so logs + the app's per-IP
    # rate limiter see the visitor, not a CF edge address. Safe ONLY with the
    # CF-8 firewall locking :443 to Cloudflare ranges. Generated/refreshed by
    # scripts/gen-cf-real-ip.sh.
    include /etc/nginx/cloudflare-real-ip.conf;   # RECONCILE: deployed from deploy/nginx/ by deploy.sh (REL-3)

    # --- security headers ---------------------------------------------------
    # HSTS lives here at the TLS edge (the app can't assert an HTTPS-only policy;
    # in dev it may run over http). 2 years, include subdomains. Enable preload
    # only once every subdomain is HTTPS-only and you intend to submit to the
    # preload list (Cloudflare can also own HSTS+preload — see CF-4).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;   # RECONCILE: confirm max-age + includeSubDomains policy
    # NOTE (SEC-1): X-Content-Type-Options, Referrer-Policy, X-Frame-Options,
    # Permissions-Policy, Cross-Origin-Opener-Policy and the Content-Security-Policy
    # are now set by the FastAPI app (backend/security.py) so the app is the single
    # source of truth and stays self-sufficient in dev/CI. They are intentionally
    # NOT duplicated here — adding them again would emit each header twice.

    # --- upload / request body cap ------------------------------------------
    # Site is read-mostly (no large uploads); keep this modest.
    client_max_body_size 16m;      # RECONCILE: confirm cap matches any real upload path

    # Certbot ACME challenge can also arrive here if HTTP was already upgraded.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;     # RECONCILE: certbot webroot path on the live host
        default_type "text/plain";
    }

    # --- large media served by nginx directly from disk ---------------------
    # ~15 GB of videos / posters. The app NEVER serves these; local /media/*
    # 404s in dev are expected. Long-lived immutable cache + no directory
    # listing. Files live under /opt/discammer/media on the host.
    location /media/ {
        alias /opt/discammer/media/;                       # RECONCILE: confirm host media root
        autoindex off;
        access_log off;                                    # RECONCILE: drop if you want media hits in the access log
        add_header Cache-Control "public, max-age=2592000, immutable";   # RECONCILE: confirm 30d immutable policy
        expires 30d;                                       # RECONCILE: confirm expires window
        try_files $uri =404;
    }

    # --- everything else proxies to the app ---------------------------------
    # Includes SSR HTML, JSON API, /static/* (app-served with ?v=mtime
    # cache-busting and its own 404 handler), and /play/* (brotli-precompressed
    # Unity assets the app emits with explicit Content-Encoding: br).
    #
    # We deliberately do NOT special-case /play/ or /static/: nginx must not
    # strip or re-set Content-Encoding on proxied responses, and by default it
    # passes the upstream Content-Encoding through unchanged. The gzip block
    # above only compresses by MIME type and will not touch the .br chunks.
    location / {
        proxy_pass http://discammer_app;

        proxy_http_version 1.1;                            # RECONCILE: needed for upstream keepalive; drop if upstream block removed
        proxy_set_header Connection "";                    # RECONCILE: clears "close" so keepalive works

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # keep $scheme so app redirects stay https
        proxy_set_header X-Forwarded-Host  $host;          # RECONCILE: present on live server?

        proxy_read_timeout 60s;                            # RECONCILE: confirm timeouts match live
        proxy_connect_timeout 5s;                          # RECONCILE: confirm timeouts match live
    }
}
