            - article [ref=e155]:
              - generic [ref=e156]:
                - paragraph [ref=e157]: Фишинг — одна из самых массовых форм интернет-мошенничества, нацеленная на получение личных и финансовых данных пользователей. Фишинговые атаки часто маскируются под легитимные сообщения от банков, соцсетей, интернет-магазинов или других сервисов. Мошенники создают поддельные сайты и письма, которые почти не отличить от настоящих, и обманом заставляют пользователей раскрыть конфиденциальные данные.
                - 'heading "Как работает фишинг? #" [level=2] [ref=e158]':
                  - text: Как работает фишинг?
                  - link "#" [ref=e159] [cursor=pointer]:
                    - /url: "#_1"
                - paragraph [ref=e160]: "Атака обычно начинается с письма или сообщения «от доверенного источника». Мошенники применяют несколько тактик:"
                - list [ref=e161]:
                  - listitem [ref=e162]:
                    - strong [ref=e163]: Электронные письма
                    - text: — самый распространённый способ. Мошенники отправляют письма от лица известных компаний со ссылками на поддельные сайты.
                  - listitem [ref=e164]:
                    - strong [ref=e165]: Поддельные сайты
                    - text: — ссылки из фишинговых писем ведут на сайты, выглядящие точь-в-точь как настоящие. Жертва считает, что находится на оригинальном ресурсе, и сама вводит данные.
                  - listitem [ref=e166]:
                    - strong [ref=e167]: Телефонные звонки и СМС
                    - text: — иногда мошенники используют звонки и сообщения, предлагая «срочную помощь» или требуя немедленно подтвердить реквизиты.
                - paragraph [ref=e168]:
                  - strong [ref=e169]: Реальная история
                  - text: ":"
                - paragraph [ref=e170]: Недавний случай ярко показал опасность таких атак. Мария, бухгалтер крупной компании, получила письмо, якобы от её банка, с темой «Срочное обновление безопасности». В письме говорилось, что её счёт заблокирован и чтобы разблокировать его, нужно немедленно перейти по ссылке и войти в личный кабинет. Письмо выглядело правдоподобно — с логотипом банка и знакомым оформлением. ⠀ Мария ничего не заподозрила, перешла по ссылке и ввела свои данные. Через несколько часов она обнаружила, что со счёта пропала крупная сумма. В банке выяснили, что она стала жертвой фишинга — мошенники получили доступ к её счёту по введённым данным и вывели деньги. Эта история — напоминание, что жертвой может стать даже самый внимательный человек, если потерять бдительность.
                - 'heading "Как защититься от фишинга #" [level=2] [ref=e171]':
                  - text: Как защититься от фишинга
                  - link "#" [ref=e172] [cursor=pointer]:
                    - /url: "#_2"
                - list [ref=e173]:
                  - listitem [ref=e174]:
                    - strong [ref=e175]: Всегда проверяйте отправителя
                    - text: . Адрес может выглядеть похоже на настоящий, но при внимательном взгляде часто видны нестыковки.
                  - listitem [ref=e176]:
                    - strong [ref=e177]: Не переходите по ссылкам из незнакомых писем
                    - text: . Безопаснее ввести адрес компании в браузер вручную.
                  - listitem [ref=e178]:
                    - strong [ref=e179]: Проверяйте подлинность сайта
                    - text: . Прежде чем вводить данные, убедитесь, что адрес начинается с «https://» и принадлежит правильному домену.
                  - listitem [ref=e180]:
                    - strong [ref=e181]: Установите защитное ПО
                    - text: . Антивирус и другие средства защиты помогают распознавать и блокировать фишинговые сайты.
                  - listitem [ref=e182]:
                    - strong [ref=e183]: "Помните: банки не запрашивают личные данные по почте"
                    - text: . Если пришло такое сообщение — лучше позвоните в банк сами.
                - paragraph [ref=e184]: Фишинговые схемы постоянно развиваются, но знание этих приёмов помогает сохранить и деньги, и данные.
