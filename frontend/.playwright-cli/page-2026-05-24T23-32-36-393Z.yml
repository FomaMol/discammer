              - /url: "#scams-are-a-supply-chain-not-a-lone-hacker"
          - paragraph [ref=e41]: The stereotype of a hooded loner in a basement is decades out of date. Today's fraud ecosystem looks much more like a tech startup with departments, vendors, customers, and a price list.
          - paragraph [ref=e42]: "A typical operation pulls from at least four specialized layers:"
          - list [ref=e43]:
            - listitem [ref=e44]:
              - text: ▸
              - strong [ref=e45]: Tooling.
              - text: Off-the-shelf
              - emphasis [ref=e46]: phishing kits
              - text: clone a brand's login page for $30–$200.
              - strong [ref=e47]: Phishing-as-a-Service
              - text: (PhaaS) platforms sell subscriptions with dashboards, A/B-tested email templates, and live victim feeds.
            - listitem [ref=e48]:
              - text: ▸
              - strong [ref=e49]: Infrastructure.
              - text: Bulletproof hosting, lookalike domains, anonymized SMS gateways, and disposable phone numbers are all rented by the hour.
            - listitem [ref=e50]:
              - text: ▸
              - strong [ref=e51]: Leads.
              - text: Stolen email lists, breach databases, and
              - emphasis [ref=e52]: lead targeting
              - text: by demographic (“65+, US, owns crypto wallet”) trade on closed forums.
            - listitem [ref=e53]:
              - text: ▸
              - strong [ref=e54]: Cash-out.
              - text: Mule networks, crypto mixers, and gift-card laundries move stolen funds out of the banking system and into the operator's pocket.
          - 'heading "Why the economics matter to you #" [level=2] [ref=e55]':
