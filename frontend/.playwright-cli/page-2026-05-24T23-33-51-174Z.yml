      - generic [ref=e19]: // ABOUT · DCM OPERATOR'S NOTE
      - heading "Who we are, and why this exists." [level=1] [ref=e20]
      - paragraph [ref=e21]: DiScammer is a field guide for everyone who has ever paused over a sketchy message and wondered if it's real. We document the patterns, simulate the situations, and respect your time. The goal is not for you to finish a course. The goal is for you to develop the reflex to pause and check.
      - region "What we believe" [ref=e22]:
        - heading "What we believe" [level=2] [ref=e23]
        - paragraph [ref=e24]: Authority comes from specificity, not aesthetics. We name the actual SMS that pretends to be from your bank, the actual platform a romance scammer messages you on, the actual time-pressure phrase that signals a confirmed pyramid. Plain language beats jargon. The reader is an equal, not a target.
      - region "What we do" [ref=e25]:
        - heading "What we do" [level=2] [ref=e26]
        - list [ref=e27]:
