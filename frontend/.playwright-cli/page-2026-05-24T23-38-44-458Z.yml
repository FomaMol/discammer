            - text: Мошенничество — это цепочка поставок, а не одиночка в худи
            - link "#" [ref=e40] [cursor=pointer]:
              - /url: "#_1"
          - paragraph [ref=e41]: "Стереотип «хакер в подвале» устарел на двадцать лет. Современный криминальный мир устроен как технологический стартап: с отделами, поставщиками, клиентами и прайс-листом."
          - paragraph [ref=e42]: "Типичная операция собирается минимум из четырёх специализированных слоёв:"
          - list [ref=e43]:
            - listitem [ref=e44]:
              - text: ▸
              - strong [ref=e45]: Инструменты.
              - text: Готовые
              - emphasis [ref=e46]: фишинговые наборы
              - text: клонируют страницу логина известного бренда за $30–$200. Платформы
              - strong [ref=e47]: Phishing-as-a-Service
              - text: (PhaaS) продают подписку с админкой, A/B-тестами писем и онлайн-лентой жертв.
            - listitem [ref=e48]:
              - text: ▸
              - strong [ref=e49]: Инфраструктура.
              - text: Bulletproof-хостинг, домены-двойники, анонимные SMS-шлюзы, одноразовые номера — всё это арендуется по часам.
            - listitem [ref=e50]:
              - text: ▸
              - strong [ref=e51]: Лиды.
              - text: Украденные базы email-адресов,
              - emphasis [ref=e52]: таргетинг
              - text: по демографии («65+, Россия, есть крипто-кошелёк») продаются на закрытых форумах.
            - listitem [ref=e53]:
              - text: ▸
              - strong [ref=e54]: Обналичка.
              - text: Сети «дроперов», крипто-миксеры и схемы с gift-картами выводят украденное из банковской системы в карман организатора.
          - 'heading "Почему эта экономика касается лично тебя #" [level=2] [ref=e55]':
            - text: Почему эта экономика касается лично тебя
            - link "#" [ref=e56] [cursor=pointer]:
              - /url: "#_2"
          - paragraph [ref=e57]:
            - text: Каждый слой специализирован и сдаётся в аренду, поэтому
            - emphasis [ref=e58]: себестоимость одной попытки атаки
            - text: — копейки. Мошенник может позволить себе разослать миллион персонализированных сообщений, чтобы поймать десяток жертв.
          - paragraph [ref=e59]: "Вывод для защиты прямой: рассчитывать на то, что атакующие ленивы, глупы или редки, нельзя. Они индустриальны. Защита — это привычки, а не везение."
