    - article [ref=e14]:
      - generic [ref=e15]: // ABOUT · DCM OPERATOR'S NOTE
      - heading "Who we are, and why this exists." [level=1] [ref=e16]
      - paragraph [ref=e17]: DiScammer is a field guide for everyone who has ever paused over a sketchy message and wondered if it's real. We document the patterns, simulate the situations, and respect your time. The goal is not for you to finish a course. The goal is for you to develop the reflex to pause and check.
      - region "What we believe" [ref=e18]:
        - heading "What we believe" [level=2] [ref=e19]
        - paragraph [ref=e20]: Authority comes from specificity, not aesthetics. We name the actual SMS that pretends to be from your bank, the actual platform a romance scammer messages you on, the actual time-pressure phrase that signals a confirmed pyramid. Plain language beats jargon. The reader is an equal, not a target.
      - region "What we do" [ref=e21]:
        - heading "What we do" [level=2] [ref=e22]
        - list [ref=e23]:
          - listitem [ref=e24]:
            - generic [ref=e25]: ▸
            - generic [ref=e26]: Maintain a threat database of 10+ scam patterns, each updated as the attack surface changes.
          - listitem [ref=e27]:
            - generic [ref=e28]: ▸
            - generic [ref=e29]: "Publish field briefings: interviews with analysts, weekly newsletters, long-form articles."
          - listitem [ref=e30]:
            - generic [ref=e31]: ▸
