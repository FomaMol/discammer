      - main [ref=e77]:
        - article [ref=e79]:
          - generic [ref=e80]:
            - paragraph [ref=e81]: Phishing is one of the most common forms of internet fraud, aimed at obtaining users' personal and financial data. Phishing attacks often disguise themselves as legitimate messages from banks, social networks, online stores, or other services. Scammers create fake websites or emails that are nearly indistinguishable from the real thing, luring users "onto the hook" with deceptive tactics to make them share confidential information.
            - 'heading "How Does Phishing Work? #" [level=2] [ref=e82]':
              - text: How Does Phishing Work?
              - link "#" [ref=e83] [cursor=pointer]:
                - /url: "#how-does-phishing-work"
            - paragraph [ref=e84]: "A phishing attack typically begins when a user receives an email or message from a \"trusted source.\" Scammers may employ several tactics:"
            - list [ref=e85]:
              - listitem [ref=e86]:
                - strong [ref=e87]: Emails
                - text: – the most common method for phishing. Scammers send emails posing as reputable companies, containing links to fake websites.
              - listitem [ref=e88]:
                - strong [ref=e89]: Spoofed Websites
                - text: – links in phishing emails often lead to websites that look identical to legitimate ones. Users may believe they are on a real site and willingly enter their data.
              - listitem [ref=e90]:
                - strong [ref=e91]: Phone Calls and SMS
                - text: – sometimes, scammers use phone calls and text messages, offering "urgent assistance" or claiming that the user must immediately verify their details.
            - paragraph [ref=e92]:
              - strong [ref=e93]: A Real Story
              - text: ":"
            - paragraph [ref=e94]:
              - text: Recently, a real-life phishing incident highlighted the dangers of such attacks. Maria, an accountant at a large company, received an email allegedly from her bank with the subject "Urgent Security Update." The email stated that her account was blocked and to unblock it, she needed to immediately click a link and log into her account. The email appeared legitimate, using the bank’s logo and familiar branding.
              - text: ⠀
              - text: Without suspecting anything, Maria clicked the link and entered her details. A few hours later, she discovered a large sum of money had been withdrawn from her account. When she contacted her bank, she learned that she had fallen victim to a phishing scam. The scammers had used the information she entered to access her account and withdraw the funds.
              - text: This story is a reminder that even the most careful people can fall victim if they don’t exercise caution.
            - 'heading "How to Protect Yourself from Phishing #" [level=2] [ref=e95]':
              - text: How to Protect Yourself from Phishing
              - link "#" [ref=e96] [cursor=pointer]:
                - /url: "#how-to-protect-yourself-from-phishing"
            - list [ref=e97]:
              - listitem [ref=e98]:
                - strong [ref=e99]: Always double-check the sender
                - text: . The sender's address may look legitimate at first, but inconsistencies can often be noticed upon closer inspection.
              - listitem [ref=e100]:
                - strong [ref=e101]: Never click on links from unknown emails
                - text: . It’s safer to manually enter the company’s web address into your browser.
              - listitem [ref=e102]:
                - strong [ref=e103]: Verify websites for authenticity
                - text: . Before entering any data, make sure the website’s address begins with "https://" and that it belongs to the correct domain.
              - listitem [ref=e104]:
                - strong [ref=e105]: Install security software
                - text: . Antivirus and other security software can help detect and block phishing sites.
              - listitem [ref=e106]:
                - strong [ref=e107]: Remember that banks don’t request personal information via email
                - text: . If you receive a message asking for personal details, it’s best to contact your bank directly.
            - paragraph [ref=e108]: Phishing schemes continue to evolve, but awareness of these tactics can help everyone keep their money and data secure.
