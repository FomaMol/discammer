              - /url: "#scams-are-a-supply-chain-not-a-lone-hacker"
          - paragraph [ref=e37]: The stereotype of a hooded loner in a basement is decades out of date. Today's fraud ecosystem looks much more like a tech startup with departments, vendors, customers, and a price list.
          - paragraph [ref=e38]: "A typical operation pulls from at least four specialized layers:"
          - list [ref=e39]:
            - listitem [ref=e40]:
              - text: ▸
              - strong [ref=e41]: Tooling.
              - text: Off-the-shelf
              - emphasis [ref=e42]: phishing kits
              - text: clone a brand's login page for $30–$200.
              - strong [ref=e43]: Phishing-as-a-Service
              - text: (PhaaS) platforms sell subscriptions with dashboards, A/B-tested email templates, and live victim feeds.
            - listitem [ref=e44]:
              - text: ▸
              - strong [ref=e45]: Infrastructure.
              - text: Bulletproof hosting, lookalike domains, anonymized SMS gateways, and disposable phone numbers are all rented by the hour.
            - listitem [ref=e46]:
              - text: ▸
              - strong [ref=e47]: Leads.
              - text: Stolen email lists, breach databases, and
              - emphasis [ref=e48]: lead targeting
              - text: by demographic (“65+, US, owns crypto wallet”) trade on closed forums.
            - listitem [ref=e49]:
              - text: ▸
              - strong [ref=e50]: Cash-out.
              - text: Mule networks, crypto mixers, and gift-card laundries move stolen funds out of the banking system and into the operator's pocket.
          - 'heading "Why the economics matter to you #" [level=2] [ref=e51]':
