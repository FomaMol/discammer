          - listitem [ref=e31]:
            - generic [ref=e32]: ▸
            - generic [ref=e33]: "Публикуем полевые сводки: интервью с аналитиками, еженедельные рассылки, длинные разборы."
          - listitem [ref=e34]:
            - generic [ref=e35]: ▸
