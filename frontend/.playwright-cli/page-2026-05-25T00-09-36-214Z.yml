      - generic [ref=e19]: // О ПРОЕКТЕ · ЗАМЕТКА ОПЕРАТОРА DCM
      - heading "Кто мы и зачем это всё." [level=1] [ref=e20]
      - paragraph [ref=e21]: "DiScammer — это полевой справочник для всех, кто хоть раз задумался над подозрительным сообщением и засомневался, настоящее ли оно. Мы документируем схемы, моделируем ситуации и уважаем ваше время. Цель не в том, чтобы вы прошли курс. Цель в том, чтобы у вас выработался рефлекс: остановиться и проверить."
      - region "Во что мы верим" [ref=e22]:
        - heading "Во что мы верим" [level=2] [ref=e23]
        - paragraph [ref=e24]: Авторитет берётся из конкретики, а не из эстетики. Мы называем именно тот SMS, который маскируется под банк, именно ту платформу, где пишет «романтический» мошенник, именно ту фразу про срок, по которой видно подтверждённую пирамиду. Простой язык лучше жаргона. Читатель — равный собеседник, а не мишень.
      - region "Что мы делаем" [ref=e25]:
        - heading "Что мы делаем" [level=2] [ref=e26]
        - list [ref=e27]:
          - listitem [ref=e28]:
            - generic [ref=e29]: ▸
