    - region "> FREQUENTLY_ASKED" [ref=e219]:
      - generic [ref=e220]: // FAQ
      - heading "> FREQUENTLY_ASKED" [level=2] [ref=e221]
      - generic [ref=e222]:
        - generic [ref=e223]:
          - heading "Who is this for?" [level=3] [ref=e224]
          - paragraph [ref=e225]: Anyone who uses email, a phone, or a bank account. The early modules assume zero background; the later ones go deep enough to be useful for IT and security teams.
        - generic [ref=e226]:
          - heading "How long will it take?" [level=3] [ref=e227]
          - paragraph [ref=e228]: Around nine hours of focused study end to end. Most people finish over two to three weeks, one module per evening, but you can pace it however suits you.
        - generic [ref=e229]:
          - heading "Do I need to install anything?" [level=3] [ref=e230]
          - paragraph [ref=e231]: No. Everything runs in the browser. The simulations work on desktop and mobile, and your progress is saved automatically.
        - generic [ref=e232]:
          - heading "Is it really free?" [level=3] [ref=e233]
          - paragraph [ref=e234]: Yes. DiScammer is a public-interest project. We do not sell your data and we do not charge for the curriculum or the certificate.
