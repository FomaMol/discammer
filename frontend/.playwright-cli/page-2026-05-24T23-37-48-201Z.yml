      - generic [ref=e67]: // СПИСОК МИССИЙ
      - heading "> ОПЕРАТИВНАЯ КАРТА" [level=2] [ref=e68]
      - paragraph [ref=e69]: Девять миссий, выполняемых по порядку. Каждая разблокируется, когда сдан предыдущий брифинг.
      - generic [ref=e71]:
        - text: "> Загрузка списка миссий"
        - generic [ref=e72]: ▮
    - region "> СТРУКТУРА_ПРОГРАММЫ" [ref=e73]:
      - generic [ref=e74]: // КАК ЭТО РАБОТАЕТ
      - heading "> СТРУКТУРА_ПРОГРАММЫ" [level=2] [ref=e75]
      - generic [ref=e76]:
        - generic [ref=e77]:
          - generic [ref=e78]: "01"
          - heading "Изучай" [level=3] [ref=e79]
          - paragraph [ref=e80]: Читайте короткий брифинг в каждом модуле — без воды и жаргона. Каждый урок начинается с вопроса, на который он отвечает, и решения, которое он улучшает.
        - generic [ref=e81]:
          - generic [ref=e82]: "02"
          - heading "Практикуй" [level=3] [ref=e83]
          - paragraph [ref=e84]: Разбирайте реальные фишинговые письма, оценивайте подозрительные магазины и отвечайте на дипфейк-звонки в коротких игровых симуляциях.
        - generic [ref=e85]:
          - generic [ref=e86]: "03"
          - heading "Получи сертификат" [level=3] [ref=e87]
          - paragraph [ref=e88]: Пройдите финальный экзамен и три сценарных симуляции, чтобы получить сертификат DiScammer Defender — его можно прикрепить к резюме и LinkedIn.
    - region "> ЧАСТЫЕ_ВОПРОСЫ" [ref=e89]:
      - generic [ref=e90]: // FAQ
      - heading "> ЧАСТЫЕ_ВОПРОСЫ" [level=2] [ref=e91]
      - generic [ref=e92]:
        - generic [ref=e93]:
          - heading "Кому это подойдёт?" [level=3] [ref=e94]
          - paragraph [ref=e95]: Любому, кто пользуется почтой, телефоном или банковским счётом. Ранние модули не требуют никаких знаний; поздние модули достаточно глубокие, чтобы быть полезными ИТ- и security-командам.
        - generic [ref=e96]:
          - heading "Сколько времени это займёт?" [level=3] [ref=e97]
          - paragraph [ref=e98]: Около девяти часов сосредоточенного обучения целиком. Большинство людей проходит за две-три недели по одному модулю в вечер, но темп выбираете вы сами.
        - generic [ref=e99]:
          - heading "Нужно что-то устанавливать?" [level=3] [ref=e100]
          - paragraph [ref=e101]: Нет. Всё работает в браузере. Симуляции запускаются на десктопе и мобильном, прогресс сохраняется автоматически.
        - generic [ref=e102]:
          - heading "Это правда бесплатно?" [level=3] [ref=e103]
          - paragraph [ref=e104]: Да. DiScammer — общественный проект. Мы не продаём ваши данные и не берём денег за курс или сертификат.
